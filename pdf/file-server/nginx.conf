server {
    listen 80;
    server_name localhost;
    charset utf-8;
    
    location / {
        root /usr/share/nginx/html;
        autoindex on;  # 啟用目錄瀏覽
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # 支援中文檔名
        charset utf-8;
        
        # 設定 CORS（如果需要跨域存取）
        add_header Access-Control-Allow-Origin *;
        
        # 強制下載 PDF
        location ~ \.pdf$ {
            add_header Content-Disposition "attachment";
        }
    }
}
